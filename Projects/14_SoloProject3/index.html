<html>
    <head>
        <title>Unit Converter</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="hero">
            <h3 id="title">Metric/Imperial Unit Conversion</h3>
            <input id="input-el" type="text">
            <br>
            <button id="btn-el">Convert</button>
        </div>
        <footer>
            <div id="containers">
                <div class="boxes">
                    <h4>Length (Meter/Feet)</h4>
                    <p id="length-el"></p>
                </div>
                <div class="boxes">
                    <h4>Volume (Liters/Gallons)</h4>
                    <p id="volume-el"></p>
                </div>
                <div class="boxes">
                    <h4>Mass (Kilograms/Pounds)</h4>
                    <p id="mass-el"></p>
                </div>
            </div>
        </footer>
        <script src="index.js"></script>
    </body>
</html>
